<svg viewBox="0 0 920 820" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34a853"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9c27b0"/>
    </marker>
    <marker id="arrowGrey" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8a97b3"/>
    </marker>
    <marker id="arrowDark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#24292f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="820" fill="#f4f6fb" rx="12"/>

  <!-- Title -->
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2340">Lab 5 — Nessus Vulnerability Scanning</text>
  <text x="460" y="49" text-anchor="middle" font-size="11" fill="#5a6a8a">Terraform (remote state) → Azure (NESSUS01, DC01, UBUNTU01, WS01 — domain: lab.local) → CVSS triage → Remediation → optional CI/CD</text>

  <!-- ============================================================ -->
  <!-- BAND A — Local toolchain -->
  <!-- ============================================================ -->

  <!-- Local Machine -->
  <rect x="20" y="62" width="430" height="112" rx="8" fill="white" stroke="#9c27b0" stroke-width="2"/>
  <rect x="20" y="62" width="430" height="24" rx="8" fill="#9c27b0"/>
  <rect x="20" y="76" width="430" height="10" fill="#9c27b0"/>
  <text x="235" y="79" text-anchor="middle" font-size="11" font-weight="700" fill="white">💻  Local Machine (yours)</text>
  <text x="32" y="102" font-size="9" font-weight="700" fill="#1a2340">Terraform CLI</text>
  <text x="108" y="102" font-size="9" fill="#444">init · plan · apply · destroy</text>
  <text x="32" y="116" font-size="9" font-weight="700" fill="#1a2340">Git + GitHub CLI</text>
  <text x="122" y="116" font-size="9" fill="#444">repo: lab5-nessus</text>
  <text x="32" y="130" font-size="9" font-weight="700" fill="#1a2340">Your public IP</text>
  <text x="118" y="130" font-size="9" fill="#444">→ source for every NSG rule below</text>
  <text x="32" y="144" font-size="9" font-weight="700" fill="#1a2340">Browser</text>
  <text x="90" y="144" font-size="9" fill="#444">→ https://&lt;NESSUS01_IP&gt;:8834 (Nessus UI)</text>
  <text x="32" y="160" font-size="8.5" fill="#777">Cost: $0 — Terraform CLI + git are free</text>

  <!-- Remote State -->
  <rect x="470" y="62" width="430" height="112" rx="8" fill="white" stroke="#333" stroke-width="2"/>
  <rect x="470" y="62" width="430" height="24" rx="8" fill="#333"/>
  <rect x="470" y="76" width="430" height="10" fill="#333"/>
  <text x="685" y="79" text-anchor="middle" font-size="11" font-weight="700" fill="white">🗄  Terraform Remote State (Azure Blob)</text>
  <text x="482" y="102" font-size="9" font-weight="700" fill="#1a2340">Resource Group:</text>
  <text x="588" y="102" font-size="9" fill="#444">RG-TerraformState (shared, reused)</text>
  <text x="482" y="116" font-size="9" font-weight="700" fill="#1a2340">Container:</text>
  <text x="558" y="116" font-size="9" fill="#444">tfstate</text>
  <text x="482" y="130" font-size="9" font-weight="700" fill="#1a2340">State key:</text>
  <text x="558" y="130" font-size="9" fill="#444">lab5-nessus.terraform.tfstate</text>
  <text x="482" y="146" font-size="8.5" fill="#777">Not destroyed by `terraform destroy` — reused</text>
  <text x="482" y="158" font-size="8.5" fill="#777">by future labs (ntfs-lab-terraform pattern)</text>

  <!-- Arrow: Local Machine -> Remote State -->
  <line x1="450" y1="112" x2="468" y2="112" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGrey)"/>
  <text x="459" y="105" font-size="8" fill="#333" text-anchor="middle">state</text>

  <!-- ============================================================ -->
  <!-- NEW BAND — GitHub Actions CI/CD (optional) -->
  <!-- ============================================================ -->
  <rect x="20" y="186" width="880" height="54" rx="8" fill="white" stroke="#24292f" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="32" y="204" font-size="11" font-weight="700" fill="#24292f">🤖  GitHub Actions — run-scan.yml (optional, scan-only, no infra rights)</text>
  <text x="32" y="220" font-size="8.5" fill="#444">workflow_dispatch or weekly schedule → OIDC login (Network Contributor on the NSG ONLY — cannot touch a VM) → reads NESSUS01_IP/RG/NSG</text>
  <text x="32" y="232" font-size="8.5" fill="#444">from repo Variables (no terraform, ever) → temp NSG rule → launch existing scan by ID → poll → export + download PDF → upload as artifact</text>

  <!-- Arrow: Local Machine -> Azure (routed through left margin so it never
       crosses label text), landing on NESSUS01. Local Machine is the ONLY
       thing that ever runs terraform apply/destroy (SOP Section 2). -->
  <polyline points="29,174 29,258 66,258" fill="none" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
  <text x="30" y="252" font-size="7.5" fill="#9c27b0">browse UI + terraform apply/destroy</text>

  <!-- Arrow: GitHub Actions -> Azure (scan only — no provisioning rights) -->
  <line x1="460" y1="240" x2="460" y2="254" stroke="#24292f" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowDark)"/>
  <text x="466" y="251" font-size="7.5" fill="#24292f">OIDC scan only — no apply/destroy</text>

  <!-- ============================================================ -->
  <!-- BAND B — Azure: everything Terraform provisions -->
  <!-- ============================================================ -->

  <rect x="20" y="254" width="880" height="396" rx="14" fill="#e8f0fe" stroke="#4285f4" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="40" y="276" font-size="13" font-weight="700" fill="#4285f4">☁  Microsoft Azure</text>

  <!-- Resource Group -->
  <rect x="38" y="286" width="674" height="352" rx="10" fill="#dce8fd" stroke="#5a9cf5" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="54" y="304" font-size="11" font-weight="700" fill="#1a73e8">Resource Group: rg-lab05-0826</text>

  <!-- VNet -->
  <rect x="54" y="314" width="642" height="316" rx="8" fill="#c8ddfb" stroke="#4285f4" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="68" y="332" font-size="10.5" font-weight="700" fill="#1a73e8">Virtual Network: lab5-nessus-vnet (10.0.0.0/16)</text>

  <!-- NSG badge -->
  <rect x="68" y="340" width="614" height="88" rx="6" fill="white" stroke="#ea4335" stroke-width="1.5"/>
  <text x="80" y="356" font-size="10" font-weight="700" fill="#ea4335">🛡  NSG — lab5-nsg, scoped to your IP only</text>
  <text x="80" y="370" font-size="8.5" fill="#444">DC01 &amp; WS01: RDP 3389 · SMB 445 · NetBIOS 139</text>
  <text x="80" y="383" font-size="8.5" fill="#444">UBUNTU01: SSH 22 · NESSUS01: Nessus UI 8834</text>
  <text x="80" y="396" font-size="8.5" fill="#444">Scanner → targets: default AllowVNetInBound (no extra rule needed)</text>
  <text x="80" y="409" font-size="8.5" fill="#444">CI pipeline opens/removes its own temp 8834 rule, scoped to runner IP only</text>
  <text x="80" y="422" font-size="8" fill="#777">Never opened to Internet/* — see main.tf, allowed_source_ip var</text>

  <!-- VM row: NESSUS01, DC01, UBUNTU01, WS01 -->
  <rect x="68" y="438" width="146" height="140" rx="8" fill="white" stroke="#9c27b0" stroke-width="2"/>
  <rect x="68" y="438" width="146" height="22" rx="8" fill="#9c27b0"/>
  <rect x="68" y="451" width="146" height="9" fill="#9c27b0"/>
  <text x="141" y="453" text-anchor="middle" font-size="9.5" font-weight="700" fill="white">🔬 NESSUS01</text>
  <text x="76" y="474" font-size="8" fill="#444">Role: Nessus Essentials host</text>
  <text x="76" y="487" font-size="8" fill="#444">OS: Ubuntu 22.04 · B2s</text>
  <text x="76" y="500" font-size="8" fill="#444">Static IP: 10.0.1.10</text>
  <text x="76" y="513" font-size="8" fill="#444">Scans other 3 over private IPs</text>
  <text x="76" y="529" font-size="7.5" font-weight="700" fill="#1a2340">Install/activate: manual SSH</text>
  <text x="76" y="540" font-size="7.5" font-weight="700" fill="#1a2340">(Section 5) — API scriptable after</text>

  <rect x="224" y="438" width="146" height="140" rx="8" fill="white" stroke="#34a853" stroke-width="2"/>
  <rect x="224" y="438" width="146" height="22" rx="8" fill="#34a853"/>
  <rect x="224" y="451" width="146" height="9" fill="#34a853"/>
  <text x="297" y="453" text-anchor="middle" font-size="9.5" font-weight="700" fill="white">🖥 DC01 — AD DC</text>
  <text x="232" y="474" font-size="8" fill="#444">Role: AD Domain Controller</text>
  <text x="232" y="487" font-size="8" fill="#444">Domain: lab.local (LAB)</text>
  <text x="232" y="500" font-size="8" fill="#444">OS: WS2025 · D2s_v3</text>
  <text x="232" y="513" font-size="8" fill="#444">Scan: Windows/SMB creds</text>
  <text x="232" y="529" font-size="7.5" font-weight="700" fill="#1a2340">Auto-promoted via VM</text>
  <text x="232" y="540" font-size="7.5" font-weight="700" fill="#1a2340">extension (right panel)</text>

  <rect x="380" y="438" width="146" height="140" rx="8" fill="white" stroke="#fbbc04" stroke-width="2"/>
  <rect x="380" y="438" width="146" height="22" rx="8" fill="#fbbc04"/>
  <rect x="380" y="451" width="146" height="9" fill="#fbbc04"/>
  <text x="453" y="453" text-anchor="middle" font-size="9.5" font-weight="700" fill="white">🐧 UBUNTU01</text>
  <text x="388" y="474" font-size="8" fill="#444">Role: Linux scan target</text>
  <text x="388" y="487" font-size="8" fill="#444">OS: Ubuntu 22.04 · B2s</text>
  <text x="388" y="500" font-size="8" fill="#444">Domain: workgroup</text>
  <text x="388" y="513" font-size="8" fill="#444">Scan: SSH creds</text>
  <text x="388" y="529" font-size="7.5" fill="#777">No app installed — plain OS</text>
  <text x="388" y="540" font-size="7.5" fill="#777">for cross-platform scanning</text>

  <rect x="536" y="438" width="146" height="140" rx="8" fill="white" stroke="#00897b" stroke-width="2"/>
  <rect x="536" y="438" width="146" height="22" rx="8" fill="#00897b"/>
  <rect x="536" y="451" width="146" height="9" fill="#00897b"/>
  <text x="609" y="453" text-anchor="middle" font-size="9.5" font-weight="700" fill="white">💻 WS01 — Client</text>
  <text x="544" y="474" font-size="8" fill="#444">Role: Domain-joined client</text>
  <text x="544" y="487" font-size="8" fill="#444">OS: Windows 11 Pro · B2s</text>
  <text x="544" y="500" font-size="8" fill="#444">Domain: lab.local (joined)</text>
  <text x="544" y="513" font-size="8" fill="#444">Scan: Windows/SMB creds</text>
  <text x="544" y="529" font-size="7.5" font-weight="700" fill="#1a2340">Auto-joined via VM</text>
  <text x="544" y="540" font-size="7.5" font-weight="700" fill="#1a2340">extension (right panel)</text>

  <!-- Arrow: NESSUS01 -> other 3 targets (scan traffic, private IPs) -->
  <line x1="214" y1="434" x2="678" y2="434" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowPurple)"/>
  <text x="446" y="429" text-anchor="middle" font-size="7.5" fill="#9c27b0">scan + creds → private IPs (AllowVNetInBound)</text>

  <!-- DNS note bar -->
  <rect x="68" y="588" width="614" height="24" rx="5" fill="#eef3fc" stroke="#4285f4" stroke-width="1"/>
  <text x="375" y="604" text-anchor="middle" font-size="8" fill="#1a73e8">VNet DNS server = DC01's private IP (10.0.1.4) → lab.local resolves VNet-wide</text>

  <!-- Key Vault (own Azure resource, sibling to the VNet inside the RG) -->
  <rect x="722" y="286" width="178" height="164" rx="8" fill="white" stroke="#1a73e8" stroke-width="2"/>
  <rect x="722" y="286" width="178" height="24" rx="8" fill="#1a73e8"/>
  <rect x="722" y="300" width="178" height="10" fill="#1a73e8"/>
  <text x="811" y="303" text-anchor="middle" font-size="10" font-weight="700" fill="white">🔑  Key Vault</text>
  <text x="730" y="326" font-size="8" font-weight="700" fill="#1a2340">Name:</text>
  <text x="762" y="326" font-size="8" fill="#444">kv-lab5-&lt;random&gt;</text>
  <text x="730" y="339" font-size="8" font-weight="700" fill="#1a2340">Secret:</text>
  <text x="766" y="339" font-size="8" fill="#444">vm-admin-password</text>
  <text x="730" y="352" font-size="8" font-weight="700" fill="#1a2340">Access:</text>
  <text x="768" y="352" font-size="8" fill="#444">RBAC</text>
  <text x="730" y="368" font-size="7.5" fill="#777">VM extension scripts still embed</text>
  <text x="730" y="379" font-size="7.5" fill="#777">the password directly — managed</text>
  <text x="730" y="390" font-size="7.5" fill="#777">identity + KV read is a noted</text>
  <text x="730" y="401" font-size="7.5" fill="#777">hardening follow-up (SOP Notes).</text>
  <text x="730" y="415" font-size="7.5" fill="#777">Also stores Nessus API keys' ref</text>
  <text x="730" y="426" font-size="7.5" fill="#777">for CI (Section 13). Via keyvault.tf</text>

  <!-- Automation note (annotation, not a literal Azure resource box) -->
  <rect x="722" y="460" width="178" height="178" rx="8" fill="#f7f8fb" stroke="#8a97b3" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="811" y="476" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4a5470">⚙  Automation</text>
  <text x="730" y="492" font-size="7.5" font-weight="700" fill="#444">dc01_promote_adds</text>
  <text x="736" y="503" font-size="7" fill="#777">Install-ADDSForest, then</text>
  <text x="736" y="513" font-size="7" fill="#777">delayed shutdown /r /t 30</text>
  <text x="730" y="528" font-size="7.5" font-weight="700" fill="#444">wait_for_dc01_promotion</text>
  <text x="736" y="539" font-size="7" fill="#777">time_sleep · 6 min</text>
  <text x="730" y="554" font-size="7.5" font-weight="700" fill="#444">ws01_domain_join</text>
  <text x="736" y="565" font-size="7" fill="#777">Add-Computer, retries 5 min</text>
  <text x="730" y="580" font-size="7" fill="#777">All 3 run during `terraform apply`</text>
  <text x="730" y="591" font-size="7" fill="#777">— no RDP session needed.</text>
  <text x="730" y="605" font-size="7" fill="#777">NESSUS01 install stays manual</text>
  <text x="730" y="616" font-size="7" fill="#777">(Tenable activation code).</text>
  <text x="730" y="629" font-size="7" fill="#777">Fallback: scripts/04-*, 05-*.ps1</text>

  <!-- ============================================================ -->
  <!-- Certification alignment strip -->
  <!-- ============================================================ -->
  <rect x="20" y="668" width="880" height="34" rx="6" fill="white" stroke="#ea4335" stroke-width="1.5"/>
  <text x="460" y="683" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ea4335">🎓  Certification Alignment: CompTIA Security+ · CySA+ · PenTest+</text>
  <text x="460" y="696" text-anchor="middle" font-size="8" fill="#777">Vulnerability management, CVSS scoring, and remediation workflow — all directly examinable</text>

  <!-- ============================================================ -->
  <!-- Workflow chip row -->
  <!-- ============================================================ -->
  <g font-size="9.5">
    <rect x="36" y="722" width="160" height="40" rx="6" fill="white" stroke="#ea4335" stroke-width="1.5"/>
    <rect x="36" y="722" width="160" height="20" rx="6" fill="#ea4335"/>
    <rect x="36" y="732" width="160" height="10" fill="#ea4335"/>
    <text x="116" y="736" text-anchor="middle" font-size="10" font-weight="700" fill="white">Findings</text>
    <text x="116" y="756" text-anchor="middle" font-size="9" fill="#444">Critical → High → Med → Low</text>

    <rect x="208" y="722" width="160" height="40" rx="6" fill="white" stroke="#f9ab00" stroke-width="1.5"/>
    <rect x="208" y="722" width="160" height="20" rx="6" fill="#f9ab00"/>
    <rect x="208" y="732" width="160" height="10" fill="#f9ab00"/>
    <text x="288" y="736" text-anchor="middle" font-size="10" font-weight="700" fill="white">CVSS Score</text>
    <text x="288" y="756" text-anchor="middle" font-size="9" fill="#444">0–10 severity scale</text>

    <rect x="380" y="722" width="160" height="40" rx="6" fill="white" stroke="#34a853" stroke-width="1.5"/>
    <rect x="380" y="722" width="160" height="20" rx="6" fill="#34a853"/>
    <rect x="380" y="732" width="160" height="10" fill="#34a853"/>
    <text x="460" y="736" text-anchor="middle" font-size="10" font-weight="700" fill="white">Remediate</text>
    <text x="460" y="756" text-anchor="middle" font-size="9" fill="#444">Patch · TLS · SMBv1 fix</text>

    <rect x="552" y="722" width="160" height="40" rx="6" fill="white" stroke="#4285f4" stroke-width="1.5"/>
    <rect x="552" y="722" width="160" height="20" rx="6" fill="#4285f4"/>
    <rect x="552" y="732" width="160" height="10" fill="#4285f4"/>
    <text x="632" y="736" text-anchor="middle" font-size="10" font-weight="700" fill="white">Re-scan</text>
    <text x="632" y="756" text-anchor="middle" font-size="9" fill="#444">Verify finding is gone</text>

    <rect x="724" y="722" width="160" height="40" rx="6" fill="white" stroke="#9c27b0" stroke-width="1.5"/>
    <rect x="724" y="722" width="160" height="20" rx="6" fill="#9c27b0"/>
    <rect x="724" y="732" width="160" height="10" fill="#9c27b0"/>
    <text x="804" y="736" text-anchor="middle" font-size="10" font-weight="700" fill="white">Report</text>
    <text x="804" y="756" text-anchor="middle" font-size="9" fill="#444">PDF — Exec + Detailed</text>
  </g>

  <line x1="196" y1="742" x2="206" y2="742" stroke="#8a97b3" stroke-width="1.5" marker-end="url(#arrowGrey)"/>
  <line x1="368" y1="742" x2="378" y2="742" stroke="#8a97b3" stroke-width="1.5" marker-end="url(#arrowGrey)"/>
  <line x1="540" y1="742" x2="550" y2="742" stroke="#8a97b3" stroke-width="1.5" marker-end="url(#arrowGrey)"/>
  <line x1="712" y1="742" x2="722" y2="742" stroke="#8a97b3" stroke-width="1.5" marker-end="url(#arrowGrey)"/>

  <text x="460" y="784" text-anchor="middle" font-size="8" fill="#5a6a8a">Workflow: Basic scan → Credentialed scan (3 targets, from NESSUS01) → Findings → CVSS scoring → Remediate → Re-scan → Export PDF report</text>
  <text x="460" y="798" text-anchor="middle" font-size="8" fill="#5a6a8a">Optional: entire deploy → scan → report loop automated via GitHub Actions (Section 13)</text>
</svg>
